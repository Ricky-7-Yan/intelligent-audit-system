[project]
name = "auditpilot"
version = "4.2.0"
description = "Evidence-grounded enterprise audit Agent workspace"
requires-python = ">=3.10,<3.13"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["_venv_old", "data", "models"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agents", "services", "rag", "web"]
omit = ["tests/*"]
