<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计分析 - 智能审计 Agent 平台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">审</div><span>智能审计</span></div>
      <nav class="nav-list">
        <a class="nav-link" href="/">⌂ <span>总览</span></a>
        <a class="nav-link" href="/chat">● <span>审计对话</span></a>
        <a class="nav-link active" href="/audit">⌕ <span>审计分析</span></a>
        <a class="nav-link" href="/knowledge">▦ <span>知识库</span></a>
        <a class="nav-link" href="/training">□ <span>评估</span></a>
      </nav>
      <div class="sidebar-note">Agent 工作流：任务规划、证据检索、控制映射、风险评分、质量门、整改计划。</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="page-title">
          <h1>审计分析</h1>
          <p>将审计对象转化为控制矩阵、证据包、风险结论和可执行整改计划。</p>
        </div>
        <div class="status-pill"><span class="status-dot"></span><span id="healthText">加载状态中</span></div>
      </div>

      <section class="panel">
        <div class="grid grid-4">
          <div class="field"><label>审计对象</label><input id="auditItem" value="ERP系统权限管理"></div>
          <div class="field"><label>审计类型</label><select id="auditType"><option>安全审计</option><option>合规审计</option><option>风险评估</option><option>内部控制审计</option></select></div>
          <div class="field"><label>参考标准</label><select id="standardType"><option>ISO27001</option><option>COBIT</option><option>SOX</option><option>数据安全法</option></select></div>
          <div class="field"><label>关注风险</label><select id="riskLevel"><option>高</option><option>中</option><option>低</option></select></div>
        </div>
        <div class="toolbar mt-16">
          <button class="btn primary" id="runAudit">运行 Agent 审计</button>
          <button class="btn" id="loadControls">查看控制库</button>
        </div>
      </section>

      <section class="kpi-row mt-16">
        <div class="card metric"><div class="metric-value" id="riskLevelCard">-</div><div class="metric-label">剩余风险</div></div>
        <div class="card metric"><div class="metric-value" id="riskScoreCard">-</div><div class="metric-label">风险评分</div></div>
        <div class="card metric"><div class="metric-value" id="complianceCard">-</div><div class="metric-label">合规评分</div></div>
        <div class="card metric"><div class="metric-value" id="qualityCard">-</div><div class="metric-label">质量门置信度</div></div>
        <div class="card metric"><div class="metric-value" id="controlsCard">-</div><div class="metric-label">映射控制</div></div>
      </section>

      <section class="grid layout-2 mt-16">
        <div class="panel">
          <h2 class="panel-title">审计结论</h2>
          <div id="auditResult" class="prewrap muted">等待分析结果</div>
        </div>
        <div class="panel">
          <h2 class="panel-title">质量门</h2>
          <div id="qualityPanel" class="muted">等待结果</div>
        </div>
      </section>

      <section class="grid grid-2 mt-16">
        <div class="panel">
          <h2 class="panel-title">任务计划</h2>
          <div id="taskPlan" class="timeline"><p class="muted">等待结果</p></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">证据包</h2>
          <div id="evidencePack" class="list dense"><p class="muted">等待结果</p></div>
        </div>
      </section>

      <section class="panel mt-16">
        <h2 class="panel-title">控制矩阵</h2>
        <div id="controlMatrix" class="matrix muted">等待结果</div>
      </section>

      <section class="panel mt-16">
        <h2 class="panel-title">整改行动计划</h2>
        <div id="recommendations" class="grid grid-3"><p class="muted">等待结果</p></div>
      </section>

      <section class="grid layout-2 mt-16">
        <div class="panel">
          <h2 class="panel-title">审计档案</h2>
          <div class="toolbar">
            <button class="btn" id="refreshRuns">刷新历史</button>
            <a class="btn" id="downloadReport" href="#" target="_blank">下载当前报告</a>
          </div>
          <div id="runHistory" class="list dense mt-16"><p class="muted">暂无历史</p></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">人工复核</h2>
          <div class="grid grid-2">
            <div class="field"><label>复核人</label><input id="reviewer" value="审计经理"></div>
            <div class="field"><label>结论</label><select id="reviewDecision"><option value="approve">通过</option><option value="need_evidence">补充证据</option><option value="reject">退回整改</option></select></div>
          </div>
          <div class="field mt-12"><label>复核意见</label><textarea id="reviewComment" rows="4" placeholder="记录人工判断、证据缺口或整改要求"></textarea></div>
          <button class="btn primary mt-16" id="submitReview">提交复核</button>
          <div id="reviewResult" class="muted mt-12"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
  <script>
    let currentRunId = null;

    function statusBadge(status) {
      return el("span", { class: `badge ${status}`, text: status });
    }

    function renderTaskPlan(tasks) {
      const node = qs("#taskPlan");
      clearNode(node);
      tasks.forEach((task, index) => {
        node.appendChild(el("div", { class: "timeline-step" }, [
          el("div", { class: "step-index", text: String(index + 1) }),
          el("div", { class: "item compact" }, [
            el("strong", { text: task.name }),
            el("div", { class: "muted", text: task.objective }),
            el("div", { class: "mt-12", text: `负责人：${task.owner}` })
          ])
        ]));
      });
    }

    function renderEvidence(items) {
      const node = qs("#evidencePack");
      clearNode(node);
      items.forEach((item) => {
        node.appendChild(el("div", { class: "item compact" }, [
          el("strong", { text: `${item.id} · ${item.source}` }),
          el("p", { class: "muted", text: item.summary }),
          el("div", { text: `用途：${item.usage}` })
        ]));
      });
    }

    function renderQuality(quality) {
      const node = qs("#qualityPanel");
      clearNode(node);
      const percent = Math.round((quality.confidence || 0) * 100);
      const ring = el("div", { class: "quality-ring" }, [el("span", { text: `${percent}%` })]);
      ring.style.setProperty("--score", percent);
      node.appendChild(el("div", { class: "quality" }, [
        ring,
        el("div", {}, [
          statusBadge(quality.status),
          el("p", { class: "muted", text: quality.review_note }),
          el("div", { text: `证据扎实度：${quality.groundedness} · 控制覆盖：${quality.control_coverage}` }),
          el("div", { class: "mt-12 muted", text: `缺失证据：${(quality.missing_evidence || []).join("、") || "无"}` })
        ])
      ]));
    }

    function renderMatrix(rows) {
      const node = qs("#controlMatrix");
      clearNode(node);
      const table = el("table");
      table.appendChild(el("thead", {}, [el("tr", {}, ["控制", "领域", "测试程序", "证据要求", "成熟度", "状态"].map((text) => el("th", { text })))]));
      const body = el("tbody");
      rows.forEach((row) => {
        body.appendChild(el("tr", {}, [
          el("td", { text: row.control_id }),
          el("td", { text: row.domain }),
          el("td", { text: row.test_procedure }),
          el("td", { text: row.evidence_required.join("、") }),
          el("td", { text: String(row.maturity_level) }),
          el("td", { text: row.status })
        ]));
      });
      table.appendChild(body);
      node.appendChild(table);
    }

    function renderRecommendations(items) {
      const node = qs("#recommendations");
      clearNode(node);
      items.forEach((rec) => {
        node.appendChild(el("div", { class: "card" }, [
          el("strong", { text: `${rec.type} · ${rec.priority}` }),
          el("p", { class: "muted", text: rec.description }),
          el("div", { text: rec.action_items.join("；") }),
          el("div", { class: "mt-12 muted", text: `责任角色：${rec.owner_role} · ${rec.due_days}天 · ${rec.success_metric}` })
        ]));
      });
    }

    async function loadRuns() {
      const node = qs("#runHistory");
      clearNode(node);
      try {
        const data = await apiFetch("/api/audit/runs?limit=10");
        if (!data.runs.length) {
          node.appendChild(el("p", { class: "muted", text: "暂无历史" }));
          return;
        }
        data.runs.forEach((run) => {
          const item = el("div", { class: "item compact" }, [
            el("strong", { text: `${run.run_id} · ${run.audit_item || ""}` }),
            el("div", { class: "muted", text: `${run.status} · 风险 ${run.risk_level || "-"} · 合规 ${run.compliance_score ?? "-"} · 质量 ${run.quality_confidence ?? "-"}` }),
            el("div", { class: "mt-12", text: run.created_at || "" })
          ]);
          item.addEventListener("click", () => loadRunDetail(run.run_id));
          node.appendChild(item);
        });
      } catch (error) {
        node.appendChild(el("p", { class: "muted", text: `加载失败：${error.message}` }));
      }
    }

    async function loadRunDetail(runId) {
      const data = await apiFetch(`/api/audit/runs/${encodeURIComponent(runId)}`);
      const result = data.run.result;
      currentRunId = runId;
      qs("#downloadReport").href = `/api/audit/runs/${encodeURIComponent(runId)}/report.md`;
      setText("#auditResult", result.response);
      setText("#riskLevelCard", result.risk_assessment.risk_level);
      setText("#riskScoreCard", result.risk_assessment.risk_score);
      setText("#complianceCard", result.compliance_check.compliance_score);
      setText("#qualityCard", result.quality_gate.confidence);
      setText("#controlsCard", result.control_matrix.length);
      renderTaskPlan(result.task_plan || []);
      renderEvidence(result.evidence_pack || []);
      renderQuality(result.quality_gate || {});
      renderMatrix(result.control_matrix || []);
      renderRecommendations(result.recommendations || []);
    }

    qs("#runAudit").addEventListener("click", async () => {
      setText("#auditResult", "正在运行 Agent 工作流...");
      try {
        const data = await apiFetch("/api/audit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audit_item: qs("#auditItem").value,
            audit_type: qs("#auditType").value,
            standard_type: qs("#standardType").value,
            risk_level: qs("#riskLevel").value
          })
        });
        const result = data.result;
        currentRunId = data.run_id;
        qs("#downloadReport").href = `/api/audit/runs/${encodeURIComponent(currentRunId)}/report.md`;
        setText("#auditResult", result.response);
        setText("#riskLevelCard", result.risk_assessment.risk_level);
        setText("#riskScoreCard", result.risk_assessment.risk_score);
        setText("#complianceCard", result.compliance_check.compliance_score);
        setText("#qualityCard", result.quality_gate.confidence);
        setText("#controlsCard", result.control_matrix.length);
        renderTaskPlan(result.task_plan || []);
        renderEvidence(result.evidence_pack || []);
        renderQuality(result.quality_gate || {});
        renderMatrix(result.control_matrix || []);
        renderRecommendations(result.recommendations || []);
        loadRuns();
      } catch (error) {
        setText("#auditResult", `分析失败：${error.message}`);
      }
    });

    qs("#loadControls").addEventListener("click", async () => {
      const data = await apiFetch("/api/audit/controls");
      renderMatrix(data.controls.map((control) => ({
        control_id: control.id,
        domain: control.domain,
        test_procedure: control.test_procedure,
        evidence_required: control.evidence_required,
        maturity_level: "-",
        status: control.objective
      })));
    });

    qs("#refreshRuns").addEventListener("click", loadRuns);
    qs("#submitReview").addEventListener("click", async () => {
      if (!currentRunId) {
        setText("#reviewResult", "请先运行或选择一条审计档案");
        return;
      }
      try {
        await apiFetch(`/api/audit/runs/${encodeURIComponent(currentRunId)}/review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reviewer: qs("#reviewer").value,
            decision: qs("#reviewDecision").value,
            comment: qs("#reviewComment").value
          })
        });
        setText("#reviewResult", "复核已保存");
        loadRuns();
      } catch (error) {
        setText("#reviewResult", `复核失败：${error.message}`);
      }
    });

    loadRuns();
  </script>
</body>
</html>
