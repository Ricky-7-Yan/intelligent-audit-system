          <div class="grid grid-2 mt-12">

            <div class="field"><label>绫诲瀷</label><input id="knowledgeType" value="manual"></div>
          </div>

  <script src="../static/app.js"></script>
  <script>
    async function refreshStats() {
      const data = await apiFetch("/api/knowledge/stats");
      const stats = data.stats;
      setText("#statsText", `${stats.total_documents} 涓垏鐗?路 ${stats.semantic_retrieval ? "璇箟鍚戦噺" : "TF-IDF"} 妫€绱?路 鍒囧潡 ${stats.chunk_size}/${stats.chunk_overlap}`);
    }

    qs("#addKnowledge").addEventListener("click", async () => {
      const text = qs("#knowledgeText").value.trim();
      if (!text) return setText("#addResult", "璇疯緭鍏ョ煡璇嗗唴瀹?);
      try {
        const data = await apiFetch("/api/knowledge/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, metadata: { source: qs("#knowledgeSource").value || "manual", type: qs("#knowledgeType").value || "manual" } })
        });
        setText("#addResult", `宸叉柊澧?${data.result.added_chunks} 涓垏鐗嘸);
        qs("#knowledgeText").value = "";
        refreshStats();
      } catch (error) {
        setText("#addResult", `鍐欏叆澶辫触锛?{error.message}`);
      }
    });

    qs("#uploadFile").addEventListener("click", async () => {
      const file = qs("#fileInput").files[0];
      if (!file) return setText("#uploadResult", "璇烽€夋嫨鏂囦欢");
      const form = new FormData();
      form.append("file", file);
      try {
        const data = await apiFetch("/api/knowledge/upload", { method: "POST", body: form });
        setText("#uploadResult", `宸蹭笂浼?${data.file}锛屾柊澧?${data.result.added_chunks} 涓垏鐗嘸);
        refreshStats();
      } catch (error) {
        setText("#uploadResult", `涓婁紶澶辫触锛?{error.message}`);
      }
    });

    qs("#searchBtn").addEventListener("click", async () => {
      const question = qs("#searchQuery").value.trim();
      if (!question) return;
      const node = qs("#searchResults");
      clearNode(node);
      node.appendChild(el("p", { class: "muted", text: "妫€绱腑..." }));
      try {
        const data = await apiFetch(`/api/knowledge/query?question=${encodeURIComponent(question)}`);
        clearNode(node);
        node.appendChild(el("div", { class: "item prewrap", text: data.result.answer }));
        (data.result.sources || []).forEach((source) => node.appendChild(el("div", { class: "item" }, [
          el("strong", { text: source.source }),
          el("p", { class: "muted", text: `score ${source.score}` }),
          el("div", { text: source.content })
        ])));
      } catch (error) {
        clearNode(node);
        node.appendChild(el("p", { class: "muted", text: `妫€绱㈠け璐ワ細${error.message}` }));
      }
    });

    refreshStats().catch(() => setText("#statsText", "缁熻鍔犺浇澶辫触"));
  </script>
