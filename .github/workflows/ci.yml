name: quality-gate

on:
  pull_request:
  push:
    branches: [main, codex/enterprise-agent-optimization]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff bandit pip-audit
      - run: python -m compileall -q agents services rag web tests scripts training knowledge_graph database
      - run: >-
          python -m pytest
          --cov=services.record_store
          --cov=services.security
          --cov=services.agent_runtime
          --cov=services.conversation_memory
          --cov=rag.agentic_rag
          --cov-report=term-missing
          --cov-fail-under=75
      - run: python scripts/audit_repro.py
      - run: ruff check agents services rag web tests scripts training knowledge_graph database
      # Low-severity B105 treats domain fields such as pass/pass_rate as
      # passwords. Block medium/high findings while preserving useful scans.
      - run: bandit -q -ll -r agents services rag web -x tests
      - run: pip-audit -r requirements.txt
      - run: |
          for file in static/*.js; do
            node --check "$file"
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t auditpilot:ci .
