app = "auditpilot"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  WEB_HOST = "0.0.0.0"
  WEB_PORT = "8080"
  PORT = "8080"
  DEBUG = "False"
  LLM_PROVIDER = "deepseek"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com"
  DEEPSEEK_MODEL = "deepseek-chat"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
